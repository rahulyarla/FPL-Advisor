name: Refresh FPL forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,17 * * *'

permissions:
  contents: read

concurrency:
  group: fpl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -u -m fpl_advisor run
      - uses: actions/upload-artifact@v4
        with:
          name: fpl-forecasts
          path: |
            reports/
            data/manifest.json
          retention-days: 14
