name: Refresh FPL forecasts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5,17 * * *'
    - cron: '17 0-4,6-16,18-23 * * *'

permissions:
  contents: write

concurrency:
  group: fpl-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check whether a deadline refresh is due
        id: deadline
        run: python .github/scripts/deadline_gate.py
        env:
          FPL_REFRESH_EVENT: ${{ github.event_name }}
          FPL_REFRESH_SCHEDULE: ${{ github.event.schedule }}
      - if: steps.deadline.outputs.refresh == 'true'
        run: python -m pip install -r requirements.txt
      - uses: actions/cache@v4
        if: steps.deadline.outputs.refresh == 'true'
        with:
          path: |
            data/http
            models/model.joblib
            models/backtest_predictions.csv.gz
          key: fpl-model-v3-${{ github.run_id }}
          restore-keys: fpl-model-v3-
      - if: steps.deadline.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -v
      - if: steps.deadline.outputs.refresh == 'true'
        run: python -u -m fpl_advisor run --skip-qualitative
      - uses: actions/upload-artifact@v4
        if: steps.deadline.outputs.refresh == 'true'
        with:
          name: fpl-forecasts
          path: |
            reports/
            data/manifest.json
            data/forecast_archive/
          retention-days: 90
      - name: Keep the public pre-deadline forecast ledger across scheduled runs
        if: github.ref == 'refs/heads/main' && steps.deadline.outputs.refresh == 'true'
        shell: bash
        run: |
          git add -f -- data/forecast_archive
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Archive pre-deadline FPL forecasts [skip ci]'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
